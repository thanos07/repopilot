services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repopilot
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://repopilot:${POSTGRES_PASSWORD}@database:5432/repopilot
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=1"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://repopilot:${POSTGRES_PASSWORD}@database:5432/repopilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_started}
volumes:
  postgres_data:
  redis_data:
